name: publish-nuget

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate tag matches PACKAGE_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source ./release.env
          echo "tag=${GITHUB_REF_NAME} version=${PACKAGE_VERSION}"
          test "${GITHUB_REF_NAME}" = "${PACKAGE_VERSION}"

      - name: Pack
        run: |
          source ./release.env
          dotnet pack src/*/*.csproj -c Release --output ./nupkgs/

      - name: NuGet login (OIDC trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
